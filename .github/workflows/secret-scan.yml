name: secret-scan

# Hard gate: block any commit/PR that introduces credentials or confidential
# firm content into this PUBLIC repo. Scans the full git history on every run,
# so a secret committed and later "deleted" still fails. Rules live in
# .gitleaks.toml; human-readable policy in SECURITY.md.

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — gitleaks detect scans every commit

      - name: Install gitleaks (pinned)
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          url=$(curl -sSL "https://api.github.com/repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" \
            | grep -o 'https://[^"]*linux_x64\.tar\.gz' | head -1)
          if [ -z "$url" ]; then echo "could not resolve gitleaks ${GITLEAKS_VERSION} linux_x64 asset"; exit 1; fi
          curl -sSL "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history for secrets & confidential content
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
